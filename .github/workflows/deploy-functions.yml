# Déploiement MANUEL des fonctions Edge sur le projet Supabase de TEST (Actions › Déployer les fonctions › Run workflow).
# Ne démarre jamais seul. Secrets GitHub requis (Settings › Secrets and variables › Actions) : SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
name: Déployer les fonctions
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Vérifier et nettoyer les secrets GitHub
        run: |
          T=$(printf %s "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]"')
          R=$(printf %s "$PROJECT_REF" | tr -d '[:space:]"')
          [[ "$T" =~ ^sbp_[A-Za-z0-9]+$ ]] || { echo "Le secret SUPABASE_ACCESS_TOKEN n'a pas la forme sbp_... : collez le jeton seul, sans autre texte."; exit 1; }
          [[ "$R" =~ ^[a-z]{20}$ ]] || { echo "Le secret SUPABASE_PROJECT_REF doit être la référence seule : 20 lettres minuscules, sans https:// ni .supabase.co."; exit 1; }
          echo "::add-mask::$T"
          echo "SUPABASE_ACCESS_TOKEN=$T" >> "$GITHUB_ENV"
          echo "PROJECT_REF=$R" >> "$GITHUB_ENV"
      - name: Préparer le dossier Supabase
        run: '[ -f supabase/config.toml ] || supabase init'
      - name: Diagnostic - le jeton voit-il le projet visé ?
        run: |
          supabase projects list -o json > "$RUNNER_TEMP/p.json" || { echo "Le jeton ne peut pas lister les projets : jeton invalide, expiré ou sans accès."; exit 1; }
          echo "Projets visibles avec ce jeton : $(jq 'length' "$RUNNER_TEMP/p.json")"
          M=$(jq -r --arg r "$PROJECT_REF" '[.[] | select((.id // .ref) == $r)] | length' "$RUNNER_TEMP/p.json")
          if [ "$M" = "0" ]; then echo "SUPABASE_PROJECT_REF n'est PAS celle d'un projet visible avec ce jeton (autre compte ou autre organisation, ou référence d'un autre projet)."; exit 1; fi
          jq -r --arg r "$PROJECT_REF" '.[] | select((.id // .ref) == $r) | "Projet visé : région " + (.region // "?")' "$RUNNER_TEMP/p.json"
      - name: Déployer
        run: |
          for fn in pointage_api activate_account; do
            echo "→ $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --no-verify-jwt --yes
          done
      - name: Adresse autorisée pour l'activation (si le secret GitHub ALLOWED_ORIGIN existe)
        env:
          ALLOWED_ORIGIN: ${{ secrets.ALLOWED_ORIGIN }}
        run: '[ -z "$ALLOWED_ORIGIN" ] || supabase secrets set ALLOWED_ORIGIN="$ALLOWED_ORIGIN" --project-ref "$PROJECT_REF" --yes'
